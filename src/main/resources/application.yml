spring:
  application:
    name: fraud-monitoring
  datasource:
    url: jdbc:postgresql://localhost:5432/fraud
    username: fraud
    password: fraud
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true     # trace/metric Kafka produce + consume (used when tracing is enabled)
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    streams:
      application-id: fraud-monitoring-streams
      properties:
        # emit every windowed update (no record cache) so the "just triggered" alert is never coalesced away
        statestore.cache.max.bytes: 0
        commit.interval.ms: 200
        # Streams defaults to "latest": records published right after the app (re)joins the group, before the first
        # fetch position is resolved, would be skipped. Always start from the beginning of an uncommitted partition.
        auto.offset.reset: earliest
        default.deserialization.exception.handler: org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
  graphql:
    graphiql:
      enabled: true
    websocket:
      path: /graphql
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

fraud:
  rules:
    window: PT1M
    max-transactions: 5
    min-distinct-locations: 2
    high-value-amount: 10000
  redis:
    feature-ttl: PT24H
  security:
    # Comma separated list of accepted API keys. The default is for local development ONLY.
    api-keys: ${FRAUD_API_KEYS:dev-local-key}
    max-request-size: 256KB
    max-batch-size: 500
    max-graph-ql-depth: 8

analytics:
  store: clickhouse        # clickhouse | memory
  clickhouse:
    url: http://localhost:8123
    user: fraud
    password: fraud
    database: fraud

simulator:
  enabled: false
  interval-ms: 500
  burst-probability: 0.02

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # OpenTelemetry tracing (OTLP/HTTP). Off by default; enable with TRACING_ENABLED=true and point at a collector.
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
