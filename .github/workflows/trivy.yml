name: Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

jobs:
  fs-scan:
    name: Filesystem scan (deps, secrets, misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: e2e/node_modules
          exit-code: "1"

  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fraud-monitoring:scan .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fraud-monitoring:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
