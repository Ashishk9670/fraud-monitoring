name: K8s manifests

on:
  push:
    branches: [main]
    paths: ["deploy/k8s/**", ".github/workflows/k8s.yml"]
  pull_request:
    paths: ["deploy/k8s/**", ".github/workflows/k8s.yml"]

permissions:
  contents: read

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate
        run: kubectl kustomize deploy/k8s | kubeconform -strict -summary -kubernetes-version 1.30.0 -
