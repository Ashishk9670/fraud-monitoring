name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # unit tests + Docker-free API tests (embedded Kafka, H2, fake Redis)
      - run: mvn -B verify -DskipITs=true -Dfailsafe.skip=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-and-coverage
          path: |
            target/surefire-reports
            target/site/jacoco
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/fraud-monitoring-*.jar

  integration:
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Testcontainers (Kafka, Redis, Postgres, ClickHouse) -- Docker is available on ubuntu-latest
      - run: mvn -B verify -Dtest='NoSuchTest' -Dsurefire.failIfNoSpecifiedTests=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: |
            target/failsafe-reports
            target/site/jacoco

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start infrastructure
        run: docker compose up -d --wait
      - name: Build and start app
        run: |
          mvn -B -DskipTests package
          nohup java -jar target/fraud-monitoring-*-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health/liveness && exit 0; sleep 2; done
          cat app.log; exit 1
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
      - name: App log
        if: failure()
        run: cat app.log
      - name: Tear down
        if: always()
        run: docker compose down -v
