name: Helm chart

on:
  push:
    branches: [main]
    paths: ["deploy/helm/**", "deploy/argocd/**", "deploy/secrets-examples/**", ".github/workflows/helm.yml"]
  pull_request:
    paths: ["deploy/helm/**", "deploy/argocd/**", "deploy/secrets-examples/**", ".github/workflows/helm.yml"]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: helm lint
        run: helm lint deploy/helm/fraud-monitoring --strict
      - name: helm template | kubeconform (defaults and HPA/PDB disabled)
        run: |
          helm template r deploy/helm/fraud-monitoring | kubeconform -strict -summary -kubernetes-version 1.30.0 -
          helm template r deploy/helm/fraud-monitoring --set autoscaling.enabled=false --set podDisruptionBudget.enabled=false \
            | kubeconform -strict -summary -kubernetes-version 1.30.0 -
      - name: Validate example manifests (External Secrets, Sealed Secrets, Argo CD) against the CRD catalog
        run: |
          kubeconform -strict -summary -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/secrets-examples deploy/argocd
