# Prometheus alerting rules for the fraud-monitoring SLOs. Runbooks: docs/runbooks/<Alert>.md
# Validate:  promtool check rules monitoring/alerts.yml && promtool test rules monitoring/alerts.test.yml
groups:
  - name: fraud-monitoring-slo
    rules:
      # SLO: 95% of alerts are turned into a case within 5s of the triggering transaction.
      - alert: FraudAlertLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(fraud_alert_latency_seconds_bucket[5m]))) > 5
        for: 5m
        labels: { severity: page, slo: alert-latency }
        annotations:
          summary: "p95 alert latency is {{ $value | humanizeDuration }} (SLO 5s)"
          runbook_url: https://github.com/Ashishk9670/fraud-monitoring/blob/main/docs/runbooks/FraudAlertLatencyHigh.md

      # SLO: fewer than 5% of HTTP requests fail with 5xx.
      - alert: FraudApiErrorRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: page, slo: error-rate }
        annotations:
          summary: "HTTP 5xx ratio is {{ $value | humanizePercentage }} (SLO 5%)"
          runbook_url: https://github.com/Ashishk9670/fraud-monitoring/blob/main/docs/runbooks/FraudApiErrorRateHigh.md

      # SLO: consumers keep up; lag stays below 1000 records.
      - alert: FraudConsumerLagHigh
        expr: max by (topic) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 5m
        labels: { severity: ticket, slo: consumer-lag }
        annotations:
          summary: "Consumer lag on {{ $labels.topic }} is {{ $value }} records (SLO 1000)"
          runbook_url: https://github.com/Ashishk9670/fraud-monitoring/blob/main/docs/runbooks/FraudConsumerLagHigh.md

      - alert: FraudPublishFailures
        expr: sum(rate(fraud_transactions_publish_failed_total[5m])) > 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Kafka is not acknowledging published transactions"
          runbook_url: https://github.com/Ashishk9670/fraud-monitoring/blob/main/docs/runbooks/FraudPublishFailures.md

      - alert: FraudAppDown
        expr: up{job="fraud-monitoring"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Scrape target {{ $labels.instance }} is down"
          runbook_url: https://github.com/Ashishk9670/fraud-monitoring/blob/main/docs/runbooks/FraudAppDown.md
