global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fraud-monitoring
    metrics_path: /actuator/prometheus
    # /actuator/prometheus requires an API key. This is the local-development default (see FRAUD_API_KEYS).
    authorization:
      type: Bearer
      credentials: dev-local-key
    static_configs:
      - targets:
          - app:8080                      # containerised app (compose profile "app")
          - host.docker.internal:8080     # app started on the host (mvn spring-boot:run)
