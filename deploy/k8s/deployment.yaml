apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-monitoring
  labels:
    app.kubernetes.io/name: fraud-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/ashishk9670/fraud-monitoring:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fraud-monitoring
            - secretRef:
                name: fraud-monitoring
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
