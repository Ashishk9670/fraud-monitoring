# EXAMPLE (no real secrets). Requires the External Secrets Operator and a configured (Cluster)SecretStore.
# Creates the Secret "fraud-monitoring" consumed by the chart (values: existingSecret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fraud-monitoring
  namespace: fraud-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-secret-store          # e.g. AWS Secrets Manager / Vault / GCP Secret Manager
  target:
    name: fraud-monitoring
    creationPolicy: Owner
  data:
    - secretKey: FRAUD_API_KEYS
      remoteRef:
        key: fraud-monitoring/api-keys
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: fraud-monitoring/postgres-password
